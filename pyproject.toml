[project]
name = "delay-ai"
version = "0.1.0"
description = "AI workflows to reduce construction project delays caused by late material deliveries"
readme = "README.md"
authors = [
    { name = "MilesWeberman", email = "webermanmiles@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "litellm>=1.105.0",
    "plotly>=7.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "streamlit-calendar>=1.4.0",
    "streamlit-js-eval>=1.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
delay-ai = "delay_ai.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
